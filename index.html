<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LibrePlay Radio Online</title>
  
  <!-- Enlace al Manifest -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#00aaff">
  
  <!-- Soporte de instalación para iOS (Safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LibrePlay">
  <link rel="apple-touch-icon" href="./icono-192.png">

  <style>
    body {
      margin: 0;
      padding: 15px;
      background-color: #0a0a0a;
      color: #ffffff;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      text-align: center;
    }

    /* REPRODUCTOR VISUAL */
    .player-card {
      background: linear-gradient(135deg, #111a2e 0%, #0a0a0a 100%);
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      border-top: 5px solid #00aaff;
      max-width: 450px;
      margin: 10px auto 25px auto;
      border-left: 1px solid #222;
      border-right: 1px solid #222;
      border-bottom: 1px solid #222;
    }

    .player-title {
      color: #ffffff;
      margin: 0;
      font-size: 26px;
    }

    .player-title span {
      color: #00aaff;
    }

    .player-slogan {
      color: #aaaaaa;
      margin: 5px 0 15px 0;
      font-size: 13px;
      font-style: italic;
    }

    /* ESTILOS DEL TOCADISCOS Y VINILO */
    .turntable-container {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 15px auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .vinyl-disc {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, #0a0a0a 18%, #1a1a1a 20%, #0a0a0a 21%, #0a0a0a 30%, #222 31%, #0a0a0a 32%, #0a0a0a 50%, #222 51%, #0a0a0a 52%, #00aaff 53%, #0088cc 68%, #0a0a0a 69%);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.8), inset 0 0 8px rgba(255, 255, 255, 0.2);
      position: absolute;
      animation: spinVinyl 2.5s linear infinite;
      animation-play-state: paused; /* Pausado por defecto */
    }

    /* Etiqueta del centro del disco */
    .vinyl-disc::after {
      content: "LibrePlay";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      background: #00aaff;
      border-radius: 50%;
      color: #fff;
      font-size: 8px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #ffffff;
      box-shadow: inset 0 0 4px rgba(0,0,0,0.5);
    }

    /* Brazo del reproductor */
    .tonearm {
      position: absolute;
      top: 5px;
      right: 10px;
      width: 60px;
      height: 90px;
      border-right: 4px solid #cccccc;
      border-bottom: 4px solid #cccccc;
      border-border-bottom-right-radius: 20px;
      transform-origin: top right;
      transform: rotate(-30deg); /* Posición inicial (fuera del disco) */
      transition: transform 0.6s ease-in-out;
      z-index: 2;
      filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.7));
    }

    /* Aguja en el extremo del brazo */
    .tonearm::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: -6px;
      width: 12px;
      height: 16px;
      background: #ff4444;
      border-radius: 2px;
    }

    /* Animación de giro */
    @keyframes spinVinyl {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Estados cuando se reproduce el audio */
    .playing .vinyl-disc {
      animation-play-state: running;
    }

    .playing .tonearm {
      transform: rotate(5deg); /* Se coloca sobre el disco */
    }

    /* BOTÓN CUSTOM DE PLAY/PAUSE */
    .play-btn {
      background: linear-gradient(135deg, #00aaff, #0066cc);
      border: none;
      color: #ffffff;
      padding: 12px 30px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 170, 255, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 10px;
    }

    .play-btn:active {
      transform: scale(0.95);
    }

    .now-playing-box {
      background: rgba(255, 255, 255, 0.05);
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 15px;
      border: 1px solid #222;
    }

    .now-playing-label {
      display: block;
      font-size: 11px;
      color: #00aaff;
      font-weight: bold;
      text-transform: uppercase;
    }

    #song-title {
      font-size: 15px;
      color: #ffffff;
      font-weight: bold;
      margin-top: 5px;
    }

    /* WIDGET OYENTES Y PAC */
    .main-card {
      display: inline-block;
      background-color: rgba(18, 18, 18, 0.95);
      padding: 12px 18px;
      border-radius: 16px;
      border: 1px solid #222;
      box-shadow: 0px 6px 15px rgba(0, 0, 0, 0.6);
      max-width: 450px;
      width: 100%;
      box-sizing: border-box;
    }

    .title {
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-bottom: 1px solid #222222;
      padding-bottom: 6px;
    }

    .title-icon { color: #00aaff; }

    .buttons-container {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .widget-box {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #000000;
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #252525;
    }

    .blinker-on {
      height: 9px;
      width: 9px;
      background-color: #00ff66;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px #00ff66;
      animation: blink 1.5s linear infinite;
    }

    .blinker-off {
      height: 9px;
      width: 9px;
      background-color: #ffaa00;
      border-radius: 50%;
      display: inline-block;
    }

    .label {
      font-size: 11px;
      font-weight: bold;
      color: #e0e0e0;
    }

    .count {
      font-size: 14px;
      color: #00aaff;
      font-weight: bold;
    }

    .unit {
      font-size: 11px;
      color: #aaaaaa;
    }

    .pac-banner {
      display: none;
      margin-top: 10px;
      background-color: rgba(255, 170, 0, 0.15);
      color: #ffcc00;
      border: 1px solid #ffaa00;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    @keyframes blink {
      50% { opacity: 0.2; }
    }
  </style>
</head>
<body>

  <!-- REPRODUCTOR PRINCIPAL -->
  <div class="player-card" id="playerContainer"> 
    <div style="margin-bottom: 10px;"> 
      <span id="status-dot" style="height: 10px; width: 10px; background-color: #4caf50; border-radius: 50%; display: inline-block; margin-right: 5px; box-shadow: 0 0 8px #4caf50;"></span> 
      <span id="status-text" style="color: #4caf50; font-weight: bold; font-size: 12px;">EN VIVO</span> 
    </div> 
    <h1 class="player-title">Radio <span>LibrePlay</span></h1> 
    <p class="player-slogan">La nueva forma de escuchar radio</p> 
    
    <!-- EFECTO TOCADISCOS Y DISCO DE VINILO -->
    <div class="turntable-container">
      <div class="vinyl-disc"></div>
      <div class="tonearm"></div>
    </div>

    <div class="now-playing-box"> 
      <span class="now-playing-label">Estás escuchando:</span> 
      <div id="song-title">Cargando información...</div> 
    </div> 
    
    <!-- REPRODUCTOR DE AUDIO Y BOTÓN -->
    <div class="audio-container"> 
      <audio id="radioplayer"> 
        <source src="https://stream.libreplaycalabozo.lat/libreplay" type="audio/mpeg"> 
        Tu navegador no soporta este reproductor de audio.
      </audio> 
      <button class="play-btn" id="playToggleBtn">▶ REPRODUCIR</button>
    </div> 
  </div>

  <!-- WIDGET DE OYENTES SIMULADOS -->
  <div class="main-card">
    <div class="title">
      <span class="title-icon">🎧</span> Oyentes LibrePlay Radio Online
    </div>

    <div class="buttons-container">
      <div class="widget-box">
        <span id="dot-icecast" class="blinker-on"></span>
        <span class="label">Google Site:</span>
        <span id="oyentes-icecast" class="count">0</span>
        <span class="unit">oyentes</span>
      </div>

      <div class="widget-box">
        <span id="dot-l2mr" class="blinker-on"></span>
        <span class="label">LISTEN2MYRADIO:</span>
        <span id="oyentes-l2mr" class="count">0</span>
        <span class="unit">oyentes</span>
      </div>
    </div>

    <div id="pac-banner" class="pac-banner">
      ⚠️ FUERA DE AIRE POR PAC
    </div>
  </div>

  <!-- SCRIPT DE MONITOREO, ANIMACIÓN Y METADATOS -->
  <script>
    const ICECAST_SERVER = "https://stream.libreplaycalabozo.lat"; 
    const statsUrl = `${ICECAST_SERVER}/status-json.xsl`;

    const audio = document.getElementById("radioplayer");
    const playBtn = document.getElementById("playToggleBtn");
    const playerContainer = document.getElementById("playerContainer");

    let actualIcecast = Math.floor(Math.random() * (100 - 50 + 1)) + 50;
    let actualL2MR = Math.floor(Math.random() * (150 - 60 + 1)) + 60;

    // CONTROL DEL REPRODUCTOR Y DE LA ANIMACIÓN DEL VINILO
    playBtn.addEventListener("click", () => {
      if (audio.paused) {
        audio.play().then(() => {
          playerContainer.classList.add("playing");
          playBtn.innerText = "❚❚ PAUSAR";
        }).catch(err => console.log("Error al reproducir:", err));
      } else {
        audio.pause();
        playerContainer.classList.remove("playing");
        playBtn.innerText = "▶ REPRODUCIR";
      }
    });

    function obtenerNumeroSimulado(valorActual, min, max) {
      const variacion = Math.floor(Math.random() * 11) - 5; 
      let nuevoValor = valorActual + variacion;
      if (nuevoValor < min) nuevoValor = min + Math.floor(Math.random() * 5);
      if (nuevoValor > max) nuevoValor = max - Math.floor(Math.random() * 5);
      return nuevoValor;
    }

    function actualizarEstadoOnline() {
      const dot = document.getElementById("status-dot");
      const txt = document.getElementById("status-text");
      dot.style.backgroundColor = "#4caf50";
      dot.style.boxShadow = "0 0 8px #4caf50";
      txt.style.color = "#4caf50";
      txt.innerText = "EN VIVO";
    }

    function actualizarEstadoPAC() {
      const dot = document.getElementById("status-dot");
      const txt = document.getElementById("status-text");
      dot.style.backgroundColor = "#f44336";
      dot.style.boxShadow = "0 0 8px #f44336";
      txt.style.color = "#f44336";
      txt.innerText = "FUERA POR PAC";
      document.getElementById("song-title").innerText = "Transmisión detenida";
      
      // Detener audio y animación si entra en estado PAC
      audio.pause();
      playerContainer.classList.remove("playing");
      playBtn.innerText = "▶ REPRODUCIR";
    }

    function verificarYActualizar() {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 4000);

      fetch(statsUrl, { signal: controller.signal })
        .then(res => {
          clearTimeout(timeoutId);
          if (!res.ok) throw new Error('Offline');
          return res.json();
        })
        .then(data => {
          actualizarEstadoOnline();
          document.getElementById('pac-banner').style.display = 'none';
          document.getElementById('dot-icecast').className = 'blinker-on';
          document.getElementById('dot-l2mr').className = 'blinker-on';

          actualIcecast = obtenerNumeroSimulado(actualIcecast, 50, 120);
          actualL2MR = obtenerNumeroSimulado(actualL2MR, 60, 150);
          document.getElementById('oyentes-icecast').innerText = actualIcecast;
          document.getElementById('oyentes-l2mr').innerText = actualL2MR;

          if (data && data.icestats && data.icestats.source) {
            const sources = data.icestats.source;
            const sourceArray = Array.isArray(sources) ? sources : [sources];
            const mySource = sourceArray.find(src => {
              const mount = src.mount || src.listenurl || "";
              return mount.includes('/libreplay');
            });

            if (mySource && (mySource.title || mySource.artist)) {
              const artist = mySource.artist ? mySource.artist : "LibrePlay Radio";
              const title = mySource.title || "Música en vivo";
              document.getElementById("song-title").innerText = artist + " - " + title;

              // Integración con pantalla de bloqueo del teléfono
              if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                  title: title,
                  artist: artist,
                  album: 'LibrePlay Radio Online',
                  artwork: [
                    { src: './icono-192.png', sizes: '192x192', type: 'image/png' },
                    { src: './icono-512.png', sizes: '512x512', type: 'image/png' }
                  ]
                });
              }
            } else {
              document.getElementById("song-title").innerText = "Radio LibrePlay - En Vivo";
            }
          }
        })
        .catch(err => {
          actualizarEstadoPAC();
          document.getElementById('pac-banner').style.display = 'flex';
          document.getElementById('dot-icecast').className = 'blinker-off';
          document.getElementById('dot-l2mr').className = 'blinker-off';
          document.getElementById('oyentes-icecast').innerText = '0';
          document.getElementById('oyentes-l2mr').innerText = '0';
        });
    }

    verificarYActualizar();
    setInterval(verificarYActualizar, 10000);

    // Registro de Service Worker para PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registrado:', reg.scope))
          .catch(err => console.error('Error SW:', err));
      });
    }
  </script>
</body>
</html>
